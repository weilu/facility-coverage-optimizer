name: Unit Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Install core deps + pytest only. PySpark is intentionally excluded:
      # the H3 Spark tests are marked `databricks` and run in the on-cluster
      # pipeline gate, not here.
      - name: Install dependencies (no PySpark)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run unit tests
        run: pytest -m "not databricks"
