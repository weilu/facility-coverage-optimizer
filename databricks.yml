bundle:
  name: health-facility-optimizer

variables:
  uc_schema:
    description: "Unity Catalog schema (passed to notebooks via dbutils.widgets)"
  uc_volume:
    description: "Volume path segment 'schema/volume' for file caches and the test wheel"
  cluster_id:
    description: "Existing cluster ID (find via: databricks clusters list)"
  countries:
    description: "JSON array of ISO3 codes for the batch job"
    default: '["AFG","BEN","BFA","BGD","CIV","CMR","DJI","ETH","GAB","GIN","GMB","GNQ","HTI","IND","JPN","KHM","LAO","MLI","MWI","NER","NGA","NPL","PAK","PSE","ROU","SDN","SEN","SOM","SRB","SSD","SYR","TCD","TGO","UZB","YEM","ZMB"]'

targets:
  dev-wei:
    default: true
    mode: development
    workspace:
      profile: adb-6102124407836814
    variables:
      uc_schema: pim
      uc_volume: pim/vpim
      cluster_id: 0212-012600-43y69ksy  # ITSDA_DAP_TEAM_gpbpinfrastructureanalysispimpam
  prod:
    mode: production
    workspace:
      profile: adb-6102124407836814
      root_path: /Workspace/Users/wlu4@worldbank.org/.bundle/${bundle.name}/${bundle.target}
    variables:
      uc_schema: sgpbpi163
      uc_volume: sgpbpi163/vgpbpi163
      cluster_id: 0212-012600-43y69ksy  # ITSDA_DAP_TEAM_gpbpinfrastructureanalysispimpam

# Test gate installs the project wheel from a UC Volume and runs pytest --pyargs,
# because this cluster doesn't mount /Workspace to the driver (see tests/run_tests.py).
x-pipeline-params: &pipeline_params
  COUNTRY_ISO3: "{{job.parameters.COUNTRY_ISO3}}"
  UC_SCHEMA: "{{job.parameters.UC_SCHEMA}}"
  UC_VOLUME: "{{job.parameters.UC_VOLUME}}"
  POPULATION_YEAR: "{{job.parameters.POPULATION_YEAR}}"
  FORCE_RECOMPUTE: "{{job.parameters.FORCE_RECOMPUTE}}"
  INCLUDE_ADM_LEVEL0: "{{job.parameters.INCLUDE_ADM_LEVEL0}}"
  # Passed to every transform task so config load never hits a missing widget;
  # only the visualize task overrides it to "true".
  ENABLE_VISUALIZATION: "false"

resources:
  jobs:
    tests:
      name: "HFO - Tests (on-cluster gate)"
      tasks:
        - task_key: run_tests
          existing_cluster_id: ${var.cluster_id}
          notebook_task:
            notebook_path: ${workspace.file_path}/tests/run_tests
            base_parameters:
              dist_dir: /Volumes/prd_mega/${var.uc_volume}/dist

    pipeline:
      name: "HFO - Pipeline (single country)"
      # Match the batch for_each concurrency so fan-out runs actually run in parallel.
      max_concurrent_runs: 4
      parameters:
        - name: COUNTRY_ISO3
          default: LAO
        - name: UC_SCHEMA
          default: ${var.uc_schema}
        - name: UC_VOLUME
          default: ${var.uc_volume}
        - name: POPULATION_YEAR
          default: "2025"
        - name: FORCE_RECOMPUTE
          default: "false"
        - name: INCLUDE_ADM_LEVEL0
          default: "true"
      tasks:
        - task_key: run_tests
          existing_cluster_id: ${var.cluster_id}
          notebook_task:
            notebook_path: ${workspace.file_path}/tests/run_tests
            base_parameters:
              dist_dir: /Volumes/prd_mega/${var.uc_volume}/dist

        - task_key: download_worldpop
          existing_cluster_id: ${var.cluster_id}
          depends_on:
            - task_key: run_tests
          notebook_task:
            notebook_path: ${workspace.file_path}/extract/01a_download_worldpop
            base_parameters: *pipeline_params

        - task_key: download_wb
          existing_cluster_id: ${var.cluster_id}
          depends_on:
            - task_key: run_tests
          notebook_task:
            notebook_path: ${workspace.file_path}/extract/01b_download_wb
            base_parameters: *pipeline_params

        - task_key: population
          existing_cluster_id: ${var.cluster_id}
          depends_on:
            - task_key: download_worldpop
          notebook_task:
            notebook_path: ${workspace.file_path}/extract/02_population
            base_parameters: *pipeline_params

        - task_key: boundaries
          existing_cluster_id: ${var.cluster_id}
          depends_on:
            - task_key: download_wb
          notebook_task:
            notebook_path: ${workspace.file_path}/extract/03_boundaries
            base_parameters: *pipeline_params

        - task_key: facilities
          existing_cluster_id: ${var.cluster_id}
          depends_on:
            - task_key: boundaries
          notebook_task:
            notebook_path: ${workspace.file_path}/extract/04_facilities
            base_parameters: *pipeline_params

        - task_key: prepare
          existing_cluster_id: ${var.cluster_id}
          depends_on:
            - task_key: facilities
            - task_key: population
          notebook_task:
            notebook_path: ${workspace.file_path}/transform/01_prepare
            base_parameters: *pipeline_params

        - task_key: coverage
          existing_cluster_id: ${var.cluster_id}
          depends_on:
            - task_key: prepare
          notebook_task:
            notebook_path: ${workspace.file_path}/transform/02_coverage
            base_parameters: *pipeline_params

        - task_key: optimize
          existing_cluster_id: ${var.cluster_id}
          depends_on:
            - task_key: coverage
          notebook_task:
            notebook_path: ${workspace.file_path}/transform/03_optimize
            base_parameters: *pipeline_params

        - task_key: visualize
          existing_cluster_id: ${var.cluster_id}
          depends_on:
            - task_key: optimize
          notebook_task:
            notebook_path: ${workspace.file_path}/transform/04_visualize
            base_parameters:
              <<: *pipeline_params
              ENABLE_VISUALIZATION: "true"
              PIPELINE_START_ISO: "{{job.start_time.iso_datetime}}"

    batch:
      name: "HFO - Batch (many countries)"
      parameters:
        - name: countries
          default: ${var.countries}
      tasks:
        - task_key: run_countries
          for_each_task:
            inputs: "{{job.parameters.countries}}"
            concurrency: 4
            task:
              task_key: pipeline_for_country
              run_job_task:
                job_id: ${resources.jobs.pipeline.id}
                job_parameters:
                  COUNTRY_ISO3: "{{input}}"
                  UC_SCHEMA: ${var.uc_schema}
                  UC_VOLUME: ${var.uc_volume}
