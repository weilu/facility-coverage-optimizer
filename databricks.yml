bundle:
  name: health-facility-optimizer

variables:
  uc_schema:
    description: "Unity Catalog schema (passed to notebooks via dbutils.widgets)"
  uc_volume:
    description: "Volume path segment 'schema/volume' for file caches"
  cluster_id:
    description: "Existing cluster ID (find via: databricks clusters list)"
  git_branch:
    description: "Git branch the jobs check out (source: GIT)"
  countries:
    description: "JSON array of ISO3 codes for the batch job"
    default: '["AFG","BEN","BFA","BGD","CIV","CMR","DJI","ETH","GAB","GIN","GMB","GNQ","HTI","IND","JPN","KHM","LAO","MLI","MWI","NER","NGA","NPL","PAK","PSE","ROU","SDN","SEN","SOM","SRB","SSD","SYR","TCD","TGO","UZB","YEM","ZMB"]'

targets:
  dev-wei:
    default: true
    mode: development
    workspace:
      profile: adb-6102124407836814
    variables:
      uc_schema: pim
      uc_volume: pim/vpim
      cluster_id: 0212-012600-43y69ksy  # ITSDA_DAP_TEAM_gpbpinfrastructureanalysispimpam
      git_branch: multi-country-dab
  prod:
    mode: production
    workspace:
      profile: adb-6102124407836814
    variables:
      uc_schema: sgpbpi163
      uc_volume: sgpbpi163/vgpbpi163
      cluster_id: 0212-012600-43y69ksy  # ITSDA_DAP_TEAM_gpbpinfrastructureanalysispimpam
      git_branch: main

# Code is delivered to the cluster via a per-run git checkout (source: GIT), which
# lands on the driver's local filesystem — unlike /Workspace files, which this
# single-user (service-principal) cluster does not mount. That local checkout is
# what lets the pytest gate import/discover the code (see tests/run_tests.py).
x-git-source: &git_source
  git_url: https://github.com/weilu/facility-coverage-optimizer.git
  git_provider: gitHub
  git_branch: ${var.git_branch}

x-pipeline-params: &pipeline_params
  COUNTRY_ISO3: "{{job.parameters.COUNTRY_ISO3}}"
  UC_SCHEMA: "{{job.parameters.UC_SCHEMA}}"
  UC_VOLUME: "{{job.parameters.UC_VOLUME}}"
  POPULATION_YEAR: "{{job.parameters.POPULATION_YEAR}}"
  FORCE_RECOMPUTE: "{{job.parameters.FORCE_RECOMPUTE}}"
  INCLUDE_ADM_LEVEL0: "{{job.parameters.INCLUDE_ADM_LEVEL0}}"

resources:
  jobs:
    tests:
      name: "HFO - Tests (on-cluster gate)"
      git_source: *git_source
      tasks:
        - task_key: run_tests
          existing_cluster_id: ${var.cluster_id}
          notebook_task:
            notebook_path: tests/run_tests
            source: GIT

    pipeline:
      name: "HFO - Pipeline (single country)"
      git_source: *git_source
      parameters:
        - name: COUNTRY_ISO3
          default: LAO
        - name: UC_SCHEMA
          default: ${var.uc_schema}
        - name: UC_VOLUME
          default: ${var.uc_volume}
        - name: POPULATION_YEAR
          default: "2025"
        - name: FORCE_RECOMPUTE
          default: "false"
        - name: INCLUDE_ADM_LEVEL0
          default: "true"
      tasks:
        - task_key: run_tests
          existing_cluster_id: ${var.cluster_id}
          notebook_task:
            notebook_path: tests/run_tests
            source: GIT

        - task_key: download_worldpop
          existing_cluster_id: ${var.cluster_id}
          depends_on:
            - task_key: run_tests
          notebook_task:
            notebook_path: extract/01a_download_worldpop
            source: GIT
            base_parameters: *pipeline_params

        - task_key: download_wb
          existing_cluster_id: ${var.cluster_id}
          depends_on:
            - task_key: run_tests
          notebook_task:
            notebook_path: extract/01b_download_wb
            source: GIT
            base_parameters: *pipeline_params

        - task_key: population
          existing_cluster_id: ${var.cluster_id}
          depends_on:
            - task_key: download_worldpop
          notebook_task:
            notebook_path: extract/02_population
            source: GIT
            base_parameters: *pipeline_params

        - task_key: boundaries
          existing_cluster_id: ${var.cluster_id}
          depends_on:
            - task_key: download_wb
          notebook_task:
            notebook_path: extract/03_boundaries
            source: GIT
            base_parameters: *pipeline_params

        - task_key: facilities
          existing_cluster_id: ${var.cluster_id}
          depends_on:
            - task_key: boundaries
          notebook_task:
            notebook_path: extract/04_facilities
            source: GIT
            base_parameters: *pipeline_params

        - task_key: prepare
          existing_cluster_id: ${var.cluster_id}
          depends_on:
            - task_key: facilities
            - task_key: population
          notebook_task:
            notebook_path: transform/01_prepare
            source: GIT
            base_parameters: *pipeline_params

        - task_key: coverage
          existing_cluster_id: ${var.cluster_id}
          depends_on:
            - task_key: prepare
          notebook_task:
            notebook_path: transform/02_coverage
            source: GIT
            base_parameters: *pipeline_params

        - task_key: optimize
          existing_cluster_id: ${var.cluster_id}
          depends_on:
            - task_key: coverage
          notebook_task:
            notebook_path: transform/03_optimize
            source: GIT
            base_parameters: *pipeline_params

        - task_key: visualize
          existing_cluster_id: ${var.cluster_id}
          depends_on:
            - task_key: optimize
          notebook_task:
            notebook_path: transform/04_visualize
            source: GIT
            base_parameters:
              COUNTRY_ISO3: "{{job.parameters.COUNTRY_ISO3}}"
              UC_SCHEMA: "{{job.parameters.UC_SCHEMA}}"
              UC_VOLUME: "{{job.parameters.UC_VOLUME}}"
              POPULATION_YEAR: "{{job.parameters.POPULATION_YEAR}}"
              FORCE_RECOMPUTE: "{{job.parameters.FORCE_RECOMPUTE}}"
              INCLUDE_ADM_LEVEL0: "{{job.parameters.INCLUDE_ADM_LEVEL0}}"
              ENABLE_VISUALIZATION: "true"
              PIPELINE_START_ISO: "{{job.start_time.iso_datetime}}"

    batch:
      name: "HFO - Batch (many countries)"
      parameters:
        - name: countries
          default: ${var.countries}
      tasks:
        - task_key: run_countries
          for_each_task:
            inputs: "{{job.parameters.countries}}"
            concurrency: 4
            task:
              task_key: pipeline_for_country
              run_job_task:
                job_id: ${resources.jobs.pipeline.id}
                job_parameters:
                  COUNTRY_ISO3: "{{input}}"
                  UC_SCHEMA: ${var.uc_schema}
                  UC_VOLUME: ${var.uc_volume}
